[package]
name = "lipa-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
reqwest.workspace = true
image.workspace = true
dirs.workspace = true
thiserror.workspace = true
tracing.workspace = true
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
httpdate = "1"
sha2 = "0.10"
serde_yaml = "0.9"
tempfile = "3"
# ONNX Runtime for RapidOCR, loaded at run time from the system library (`load-dynamic`): nothing is linked or downloaded at build time.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "tracing", "cuda", "rocm", "migraphx"] }

[dev-dependencies]
# Draws the text of the opt-in OCR tests (no Python): a pure Rust rasterizer, never part of the application.
ab_glyph = "0.2"
